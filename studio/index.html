<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
  <title>Studio · 迩迩的小站</title>
<style>
  /* 纸墨主题：令牌与 src/styles/global.css 对齐，一个站一套视觉 */
  :root {
    color-scheme: light;
    --bg: #f5f3ee; --panel: #fbfaf6; --fg: #23262b; --muted: #6f6b60;
    --border: #ddd7c8; --accent: #2f4d7e; --accent-fg: #f5f3ee; --accent-weak: #e9edf4;
    --ok: #3e7a5e; --danger: #bf3b2b; --warn-bg: #f6efe1; --warn-fg: #8a5a1d; --warn-border: #e3cfa7;
    --seal: #bf3b2b; --seal-fg: #f7f4ec;
    --radius: 6px;
    --font-display: "Noto Serif SC", "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", "STSong", SimSun, Georgia, serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1a1c20; --panel: #20232a; --fg: #e6e2d8; --muted: #9b968a; --danger: #e0705c;
      --border: #383b40; --accent: #a9bedf; --accent-fg: #1a1c20; --accent-weak: rgba(169, 190, 223, 0.14);
      --warn-bg: rgba(224, 166, 66, 0.12); --warn-fg: #e4b568; --warn-border: rgba(224, 166, 66, 0.34);
      --ok: #6fbf97; --seal: #cf5741;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: grid; grid-template-columns: 260px 1fr; height: 100vh; overflow: hidden;
  }
  /* 侧栏 */
  .side { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .brand {
    padding: 16px; border-bottom: 1px solid var(--border); font-weight: 700;
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-display); font-size: 17px; letter-spacing: 0.03em;
  }
  .brand small {
    display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px;
    font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0;
  }
  .seal {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 30px; height: 30px; border-radius: 5px;
    background: var(--seal); color: var(--seal-fg);
    font-family: var(--font-display); font-size: 17px; font-weight: 700; line-height: 1;
    transform: rotate(-3deg);
    box-shadow: inset 0 0 0 1.5px rgba(247, 244, 236, 0.28);
  }
  .types { padding: 10px; display: flex; gap: 6px; }
  .types button {
    flex: 1; padding: 7px 0; border: 1px solid var(--border); background: var(--panel);
    color: var(--fg); border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px;
  }
  .types button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .list { flex: 1; overflow: auto; padding: 0 10px 10px; min-height: 0; }
  .list button {
    display: block; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 4px;
    border: 1px solid transparent; background: none; color: var(--fg); border-radius: 6px;
    cursor: pointer; font: inherit; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .list button:hover { background: var(--accent-weak); }
  .list button[aria-current="true"] { background: var(--accent-weak); border-color: var(--accent); }
  .list .new { color: var(--accent); font-weight: 600; }
  .list .draft::after { content: '草稿'; float: right; font-size: 11px; color: var(--muted); }

  /* 主区 */
  .main { display: flex; flex-direction: column; min-height: 0; }
  .bar {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .bar .hint { color: var(--muted); font-size: 13px; margin-right: auto; }
  .form { flex: 1; overflow: auto; padding: 20px; min-height: 0; }
  .form-inner { max-width: 760px; }
  label.f { display: block; margin-bottom: 16px; }
  label.f > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=date], input[type=datetime-local], select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--panel); color: var(--fg); font: inherit;
  }
  textarea { resize: vertical; line-height: 1.75; }
  button.act {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); cursor: pointer; font: inherit; font-size: 14px;
  }
  button.act.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.act:disabled { opacity: .5; cursor: not-allowed; }
  .req { color: var(--danger); }

  /* 评分 */
  .rate-set { border: none; margin: 0 0 16px; padding: 0; }
  .rate-set legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 5px; }
  .rate { display: flex; gap: 6px; align-items: center; }
  .rate button {
    width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--panel); cursor: pointer; padding: 0;
  }
  .rate button[data-on="1"] { background: var(--accent); border-color: var(--accent); }
  .rate .clear { width: auto; height: auto; border: none; background: none; color: var(--muted); font-size: 12px; }

  /* 图片 */
  .drop {
    border: 1.5px dashed var(--border); border-radius: var(--radius); padding: 22px;
    text-align: center; color: var(--muted); cursor: pointer; font-size: 14px;
  }
  .drop.over { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
  .shot { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--panel); }
  .shot img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .shot .cap { padding: 6px 8px; font-size: 11px; color: var(--muted); }
  .shot input { width: 100%; border: none; border-top: 1px solid var(--border); padding: 5px 8px;
                background: none; color: var(--fg); font: inherit; font-size: 12px; }
  .shot .del { width: 100%; border: none; border-top: 1px solid var(--border); padding: 4px;
               background: none; color: var(--muted); cursor: pointer; font-size: 11px; }
  .cover-box { display: flex; gap: 12px; align-items: flex-start; }
  .cover-box img { width: 90px; border-radius: 6px; border: 1px solid var(--border); display: block; }
  .list-group {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 14px 10px 4px; font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .list-group span { font-weight: 400; }
  .f-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  button.mini {
    padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--fg); cursor: pointer; font: inherit; font-size: 12px;
  }
  button.mini.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  button.mini:hover { filter: brightness(1.08); }
  .cover-hits {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 8px; margin-top: 10px;
  }
  .cover-hit {
    display: flex; flex-direction: column; gap: 4px; padding: 6px; text-align: left;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
    color: inherit; font: inherit;
  }
  .cover-hit:hover, .cover-hit:focus-visible { border-color: var(--accent); }
  .cover-hit img {
    width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
    border-radius: 4px; background: var(--border); display: block;
  }
  .cover-hit b { font-size: 12px; line-height: 1.3; word-break: break-word; }
  .cover-hit span { font-size: 11px; color: var(--muted); line-height: 1.3; }
  .cover-hit i { font-size: 10px; color: var(--muted); font-style: normal; }
  .cover-hits .tip { grid-column: 1 / -1; margin: 0; }

  .tip { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px;
         background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-border); }
  .log { padding: 10px 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted);
         white-space: pre-wrap; max-height: 140px; overflow: auto; }
  .log b { color: var(--fg); font-family: var(--font-mono); }
  .log .ok { color: var(--ok); }
  .log .err { color: var(--danger); }
  /* 危险操作和保存离远一点，也不做成实心按钮 —— 别让它长得像个该点的东西 */
  .danger {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .danger button {
    padding: 6px 14px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: 1px solid var(--danger); color: var(--danger);
  }
  .danger button:hover { background: var(--danger); color: var(--seal-fg); }
  .danger span { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: rgba(191, 59, 43, 0.16); }
  @media (prefers-color-scheme: dark) { ::selection { background: rgba(207, 87, 65, 0.32); } }
</style>
</head>
<body>
  <aside class="side">
    <div class="brand"><span class="seal" aria-hidden="true">迩</span><span>Studio<small>迩迩的小站</small></span></div>
    <div class="types" id="types"></div>
    <div class="list" id="list"></div>
  </aside>

  <div class="main">
    <div class="bar">
      <span class="hint" id="hint"></span>
      <button class="act" id="btn-check">跑一遍校验</button>
      <button class="act primary" id="btn-save">保存</button>
      <button class="act" id="btn-commit">提交</button>
      <button class="act" id="btn-push">发布上线</button>
    </div>
    <div class="form" id="form"><p class="empty">左边选一条，或者新建。</p></div>
    <div class="log" id="log"></div>
  </div>

<script type="module">
const $ = (s) => document.querySelector(s);
let S = null;              // 服务端状态
let cur = { type: 'moments', id: null, front: {}, body: '', photos: [], cover: null };

const log = (msg, cls = '') => {
  const el = $('#log');
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.innerHTML += `<div><b>${time}</b> <span class="${cls}">${msg}</span></div>`;
  el.scrollTop = el.scrollHeight;
};
const api = async (path, opts) => {
  const r = await fetch(path, opts);
  const d = await r.json();
  if (!r.ok || d.error) throw new Error(d.error ?? ('HTTP ' + r.status));
  return d;
};

// md 的解析在服务端做（studio/lib.mjs），和写入是同一组往返测试锁着的。
// 客户端再解析一份的话，两边转义规则一失配就会把内容改坏。

// ——— 渲染 ———
function renderTypes() {
  $('#types').innerHTML = Object.entries(S.types)
    .map(([k, t]) => `<button data-t="${k}" aria-pressed="${k === cur.type}">${t.label}</button>`).join('');
  $('#types').onclick = (e) => {
    const b = e.target.closest('button[data-t]');
    if (b) { cur.type = b.dataset.t; newEntry(); renderTypes(); renderList(); }
  };
  $('#hint').textContent = S.types[cur.type].hint;
}

function renderList() {
  const items = S.collections[cur.type] ?? [];
  const t = S.types[cur.type];
  const btn = (e) => {
    const isDraft = e.front?.draft === true || String(e.front?.draft) === 'true';
    return `<button data-id="${e.id}" class="${isDraft ? 'draft' : ''}" aria-current="${e.id === cur.id}">${e.title}</button>`;
  };

  let html = `<button class="new">＋ 新建</button>`;
  const groupKey = t.groupBy;
  const opts = groupKey ? (t.fields.find((f) => f.key === groupKey)?.options ?? []) : [];
  if (groupKey && opts.length) {
    for (const o of opts) {
      const mine = items.filter((e) => String(e.front?.[groupKey] ?? '') === o.v);
      if (!mine.length) continue;
      html += `<div class="list-group">${escapeHtml(o.t)}<span>${mine.length}</span></div>` + mine.map(btn).join('');
    }
    // 值不在选项里的条目也得列出来（手写的 md、以后新增的类型），
    // 否则它们会从侧栏里凭空消失，而文件明明还在
    const known = new Set(opts.map((o) => o.v));
    const rest = items.filter((e) => !known.has(String(e.front?.[groupKey] ?? '')));
    if (rest.length) html += `<div class="list-group">其他<span>${rest.length}</span></div>` + rest.map(btn).join('');
  } else {
    html += items.map(btn).join('');
  }
  $('#list').innerHTML = html;
  $('#list').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.classList.contains('new')) return newEntry();
    load(b.dataset.id);
  };
}

function newEntry() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const localDT = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const today = localDT.slice(0, 10);
  cur = { type: cur.type, id: null, front: {}, body: '', photos: [], cover: null };
  for (const f of S.types[cur.type].fields) {
    if (f.type === 'datetime') cur.front[f.key] = localDT;
    else if (f.type === 'date') cur.front[f.key] = today;
    else if (f.type === 'select') cur.front[f.key] = f.options[0].v;
  }
  renderForm(); renderList();
}

function load(id) {
  const e = (S.collections[cur.type] ?? []).find((x) => x.id === id);
  if (!e) return;
  const front = { ...(e.front ?? {}) };
  cur = {
    type: cur.type, id,
    front, body: e.body ?? '',
    photos: S.types[cur.type].photos ? (e.photos ?? []) : [],
    cover: front.cover ?? null,
  };
  // 关联了长文的条目，打开就该是长文模式，正文从关联的那篇载进来 ——
  // 否则一保存就会又派生出一篇新的，同一条内容散成两份。
  if (S.types[cur.type].fields.some((f) => f.key === 'noteMode')) {
    const linked = front.essay
      ? (S.collections.essays ?? []).find((e) => e.id === front.essay)
      : null;
    cur.front.noteMode = linked ? 'essay' : 'blurb';
    if (linked) {
      cur.front.noteTitle = linked.front?.title ?? '';
      cur.front.noteBody = linked.body ?? '';
    }
  }
  // datetime-local 不认 ISO 里的时区后缀，截到分钟
  for (const f of S.types[cur.type].fields) {
    if (f.type === 'datetime' && cur.front[f.key]) cur.front[f.key] = String(cur.front[f.key]).slice(0, 16);
  }
  renderForm(); renderList();
}

// onlyWhen 写成 { kind: 'book' } 或 { kind: ['book', 'movie'] }。
// 三处判断以前各写一遍、都只认单值，加影视时 status 就会在影视条目上消失。
function shows(f) {
  if (!f.onlyWhen) return true;
  const [k, want] = Object.entries(f.onlyWhen)[0];
  const now = String(cur.front[k] ?? '');
  return Array.isArray(want) ? want.map(String).includes(now) : now === String(want);
}

// 同一个字段在不同类型下叫法不一样：creator 对书是「作者」，对菜是「菜系」。
// 写成 labelWhen: { kind: { dish: '菜系', taste: '店家' } }，没命中就用默认 label。
function labelOf(f) {
  if (!f.labelWhen) return f.label;
  const [k, map] = Object.entries(f.labelWhen)[0];
  return map[String(cur.front[k] ?? '')] ?? f.label;
}

// 封面搜索只对有封面源的类型有意义（书 / 音乐 / 影视）。
// 菜去搜只会搜回一堆同名的书和电影 —— 按钮留在那里就是在骗人点。
function canMatch() {
  const t = S.types[cur.type];
  if (!t.matchFrom) return false;
  if (!t.matchWhen) return true;
  const [k, want] = Object.entries(t.matchWhen)[0];
  const now = String(cur.front[k] ?? '');
  return Array.isArray(want) ? want.map(String).includes(now) : now === String(want);
}

function field(f) {
  const v = cur.front[f.key] ?? '';
  const req = f.required ? ' <span class="req">*</span>' : '';
  // 「按标题匹配信息」挂在 schema 指定的那个字段右上角 ——
  // 挨着标题点，比翻到下面封面栏里再点直观
  const action = f.key === (S.types[cur.type].matchFrom ?? '') && canMatch()
    ? `<button type="button" id="cover-go" class="mini primary">按标题匹配信息</button>` : '';
  const head = `<span class="f-label">${labelOf(f)}${req}${action}</span>`;
  if (f.type === 'select')
    return `<label class="f">${head}<select data-k="${f.key}">${f.options
      .map((o) => `<option value="${o.v}"${String(v) === o.v ? ' selected' : ''}>${o.t}</option>`).join('')}</select></label>`;
  if (f.type === 'textarea')
    return `<label class="f">${head}<textarea data-k="${f.key}" rows="${f.rows ?? 3}">${escapeHtml(v)}</textarea></label>`;
  if (f.type === 'date' || f.type === 'datetime')
    return `<label class="f">${head}<input type="${f.type === 'date' ? 'date' : 'datetime-local'}" data-k="${f.key}" value="${escapeHtml(v)}" /></label>`;
  if (f.type === 'tags')
    return `<label class="f">${head}<input type="text" data-k="${f.key}" data-tags="1" value="${escapeHtml(Array.isArray(v) ? v.join(', ') : v)}" placeholder="逗号分隔" /></label>`;
  if (f.type === 'bool')
    return `<label class="f" style="display:flex;gap:8px;align-items:center"><input type="checkbox" data-k="${f.key}" ${String(v) === 'true' || v === true ? 'checked' : ''} style="width:auto" /><span style="margin:0">${f.label}</span></label>`;
  if (f.type === 'rating') {
    const n = Number(v) || 0;
    // 用 fieldset 而不是 label：<button> 是可关联标签的元素，
    // 裹在 <label> 里时点一下「评分」两个字就会激活第一个按钮，把分数悄悄设成 1。
    // 每个按钮也要有可访问名字，否则读屏软件只会念一串「按钮 按钮 按钮」。
    return `<fieldset class="f rate-set"><legend>${f.label}</legend>
      <span class="rate" data-k="${f.key}" role="group" aria-label="${f.label}">${
      [1, 2, 3, 4, 5]
        .map((i) => `<button type="button" data-v="${i}" data-on="${i <= n ? 1 : 0}"
             aria-label="${i} 分" aria-pressed="${i === n}"></button>`)
        .join('')
    }<button type="button" class="clear" data-v="0">不评分</button></span></fieldset>`;
  }
  if (f.type === 'ref') {
    const opts = (S.collections[f.refTo] ?? []).map((e) => `<option value="${e.id}"${v === e.id ? ' selected' : ''}>${e.title}</option>`).join('');
    return `<label class="f">${head}<select data-k="${f.key}"><option value="">（不关联）</option>${opts}</select></label>`;
  }
  return `<label class="f">${head}<input type="text" data-k="${f.key}" value="${escapeHtml(v)}" placeholder="${f.placeholder ?? ''}" /></label>`;
}
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderForm() {
  const t = S.types[cur.type];
  const visible = t.fields.filter(shows);
  const mediaDir = t.flat ? t.dir.split('/').pop() : `${t.dir.split('/').pop()}/${cur.id ?? ''}`;

  // 封面栏先拼好，好插到 coverAfter 指定的字段后面。
  // coverAfter 指的字段要是被 onlyWhen 藏起来了，就退回到末尾 —— 不能让封面栏整个消失。
  const coverBox = !t.cover ? '' : `<label class="f"><span>封面</span>
      <div class="cover-box">
        ${cur.cover ? `<img src="/media/${mediaDir}/${String(cur.cover).replace('./', '')}" alt="" />` : ''}
        <div style="flex:1">
          <div class="drop" id="drop-cover" role="button" tabindex="0" aria-label="选择或拖入封面">拖一张封面进来，或点击/按回车选择</div>
          <div class="cover-hits" id="cover-hits"></div>
        </div>
      </div></label>`;

  $('#form').innerHTML = `<div class="form-inner">
    ${cur.id ? '' : '<div class="tip">新建的条目会在第一次保存时确定文件名。</div>'}
    ${visible.map((f) => field(f) + (t.cover && f.key === t.coverAfter ? coverBox : '')).join('')}
    ${t.cover && !visible.some((f) => f.key === t.coverAfter) ? coverBox : ''}
    ${t.photos ? `<label class="f"><span>照片</span>
      <div class="drop" id="drop-photos" role="button" tabindex="0" aria-label="选择或拖入照片">把照片拖进来（可多张），也可以按回车选择。会自动压缩，并读出拍摄时间和相机参数。</div>
      <div class="shots" id="shots"></div></label>` : ''}
    ${t.bodyLabel ? `<label class="f"><span>${t.bodyLabel}${t.bodyRequired ? ' <span class="req">*</span>' : ''}</span>
      <textarea data-body="1" rows="${cur.type === 'essays' ? 16 : 4}">${escapeHtml(cur.body)}</textarea></label>` : ''}
    ${field({ key: 'draft', label: '存为草稿（线上不显示）', type: 'bool' })}
    ${cur.id ? `<div class="danger">
      <button type="button" id="btn-delete">删除这一条</button>
      <span>封面 / 照片会一起删掉</span>
    </div>` : ''}
  </div>`;

  // innerHTML 刚换过，每次都要重新挂
  const del = $('#btn-delete');
  if (del) del.onclick = () => remove().catch((e) => log(e.message, 'err'));

  $('#form').oninput = (e) => {
    const el = e.target;
    if (el.dataset.body) { cur.body = el.value; return; }
    const k = el.dataset.k;
    if (!k) return;
    if (el.type === 'checkbox') cur.front[k] = el.checked;
    else if (el.dataset.tags) cur.front[k] = el.value.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    else cur.front[k] = el.value;
    // 有别的字段的显示条件挂在它身上，就得重画一遍表单。
    // 原来这里写死的是 k === 'kind'，加「这段文字」这个下拉时就漏了 ——
    // 值改了、依赖它的字段却不出现。改成看 schema 自己说了算。
    // 只认 select 和勾选框：文本框每敲一个字都重画的话，焦点会一直丢。
    const drives = S.types[cur.type].fields.some(
      (f) => f.onlyWhen && Object.keys(f.onlyWhen)[0] === k);
    if (drives && (el.tagName === 'SELECT' || el.type === 'checkbox')) renderForm();
  };
  $('#form').onclick = (e) => {
    const b = e.target.closest('.rate button');
    if (!b) return;
    const k = b.closest('.rate').dataset.k;
    const v = Number(b.dataset.v);
    cur.front[k] = v || '';
    renderForm();
  };

  if (t.photos) { renderShots(); wireDrop('#drop-photos', true); }
  if (t.cover) {
    wireDrop('#drop-cover', false);
    const go = $('#cover-go');
    if (go) go.onclick = findCovers;
  }
}

function renderShots() {
  const t = S.types[cur.type];
  const dir = `${t.dir.split('/').pop()}/${cur.id ?? ''}`;
  $('#shots').innerHTML = cur.photos.map((p, i) => `
    <div class="shot">
      <img src="/media/${dir}/${String(p.src).replace('./', '')}" alt="" />
      <input type="text" data-alt="${i}" value="${escapeHtml(p.alt)}" placeholder="alt 描述" />
      <div class="cap">${p.exif?.camera ? [p.exif.camera, p.exif.focal, p.exif.aperture, p.exif.shutter, p.exif.iso && 'ISO ' + p.exif.iso].filter(Boolean).join(' · ') : '无 EXIF'}</div>
      <button class="del" data-del="${i}">移除</button>
    </div>`).join('');
  $('#shots').oninput = (e) => {
    const i = e.target.dataset.alt;
    if (i != null) cur.photos[Number(i)].alt = e.target.value;
  };
  $('#shots').onclick = (e) => {
    const i = e.target.dataset.del;
    if (i != null) { cur.photos.splice(Number(i), 1); renderShots(); }
  };
}

function wireDrop(sel, multi) {
  const el = $(sel);
  if (!el) return;
  const pick = () => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = multi;
    inp.onchange = () => upload([...inp.files], multi);
    inp.click();
  };
  el.onclick = pick;
  // 拖拽区原来只响应鼠标，键盘用户没有任何别的方式加图
  el.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
  };
  el.ondragover = (e) => { e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = (e) => {
    e.preventDefault(); el.classList.remove('over');
    upload([...e.dataTransfer.files].filter((f) => f.type.startsWith('image/')), multi);
  };
}

async function upload(files, multi) {
  if (!files.length) return;
  // 图片要落到条目自己的目录里，所以未保存的新条目得先落一次盘拿到 slug
  if (!cur.id) {
    if (!validate(true)) return;
    await save({ silent: true });
  }
  for (const f of files) {
    try {
      log(`上传 ${f.name}…`);
      const q = new URLSearchParams({ type: cur.type, slug: cur.id, name: f.name });
      // 换封面时告诉服务端旧的那张是谁，好一并删掉。
      // 照片（multi）是往上加的，不替换任何东西，不能传
      if (!multi && cur.cover) q.set('replacing', String(cur.cover));
      const r = await api('/api/upload?' + q, { method: 'POST', body: f });
      const kb = (n) => Math.round(n / 1024) + 'KB';
      log(`${f.name} → ${kb(r.before)} 压到 ${kb(r.bytes)}`, 'ok');
      if (multi) {
        cur.photos.push({ src: r.src, alt: '', exif: r.exif });
        // 第一张照片的拍摄时间直接用作这条动态的时间，省得手敲
        if (r.shotAt && cur.photos.length === 1) {
          cur.front.date = r.shotAt.slice(0, 16);
          log('时间已按 EXIF 填成 ' + r.shotAt, 'ok');
        }
        if (r.gps && !cur.front.place) log('这张图带 GPS：' + r.gps.lat.toFixed(4) + ', ' + r.gps.lon.toFixed(4) + '（地点仍需自己填）');
      } else {
        cur.cover = r.src;
        cur.front.cover = r.src;
      }
    } catch (err) { log(`${f.name} 失败：${err.message}`, 'err'); }
  }
  renderForm();
}

// ——— 封面检索 ———
//
// 书走豆瓣图书、影视走豆瓣电影，音乐一次打 QQ / iTunes / 网易云三家。
// 缩略图不能直接 <img src> 指向豆瓣 —— 那边有防盗链，不带 Referer 返回 418，
// 而跨站 Referer 浏览器伪造不了，所以图也得从自家服务端转一手。
async function findCovers() {
  const box = $('#cover-hits');
  if (!box) return;
  const kind = String(cur.front.kind ?? '');
  // 直接用标题。上面刚填过一遍，再让人输一次是白费事
  const q = String(cur.front.title ?? '').trim();
  if (!q) { box.innerHTML = '<p class="tip">先把标题填了，再点「按标题匹配信息」。</p>'; return; }
  box.innerHTML = '<p class="tip">搜索中…</p>';
  try {
    const r = await api(`/api/cover/search?kind=${encodeURIComponent(kind)}&q=${encodeURIComponent(q)}`);
    const dead = (r.failed ?? []).map((f) => f.source).join('、');
    if (!r.results.length) {
      box.innerHTML = `<p class="tip">没搜到${dead ? `（${escapeHtml(dead)} 这次没响应）` : ''}。改改上面的标题再试，或者直接拖一张图进来。</p>`;
      return;
    }
    box.innerHTML =
      r.results.map((h, i) => `
        <button type="button" class="cover-hit" data-i="${i}">
          <img src="/api/cover/thumb?u=${encodeURIComponent(h.thumb)}" alt="" loading="lazy" />
          <b>${escapeHtml(h.title)}</b>
          <span>${escapeHtml(h.subtitle || '')}</span>
          <i>${escapeHtml(h.source)}</i>
        </button>`).join('') +
      (dead ? `<p class="tip">${escapeHtml(dead)} 这次没响应，下面是其余来源的结果。</p>` : '');
    box.querySelectorAll('.cover-hit').forEach((b) => {
      b.onclick = () => pickCover(r.results[Number(b.dataset.i)]);
      // 有的源会给出已经失效的封面地址。图取不回来就把这个候选撤掉，
      // 留个空白格子在那儿只会让人以为是自己网卡了
      const img = b.querySelector('img');
      if (img) img.onerror = () => b.remove();
    });
  } catch (e) {
    // 这些都是非公开接口，挂了是常态。挂了也只是搜不到，拖图那条路照旧
    box.innerHTML = `<p class="tip">搜索失败：${escapeHtml(e.message)}。直接拖一张图进来也行。</p>`;
  }
}

async function pickCover(hit) {
  const box = $('#cover-hits');
  if (box) box.innerHTML = '<p class="tip">正在下载并压缩…</p>';
  try {
    const r = await api('/api/cover/pick', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        type: cur.type, slug: cur.id ?? '', url: hit.full,
        name: hit.title,
        // 让服务端把上一张删了，免得反复试封面攒下一堆一模一样的图
        replacing: cur.cover ?? null,
      }),
    });
    cur.cover = r.src;
    cur.front.cover = r.src;
    log(`封面已存下：${r.src}（${Math.round(r.bytes / 1024)}KB，${r.width}×${r.height}）`, 'ok');

    // 顺手把作者 / 歌手 / 导演填了。已经填过的不覆盖 —— 你可能有自己的写法
    // （「[美] 黄仁宇」和「黄仁宇」），但会说一声搜到的是什么，想换自己改。
    const who = String(hit.creator ?? '').trim();
    if (who) {
      const had = String(cur.front.creator ?? '').trim();
      if (!had) { cur.front.creator = who; log(`顺便填上了：${who}`, 'ok'); }
      else if (had !== who) log(`搜到的是「${who}」，你填的是「${had}」，没动它。`);
    }
    renderForm();
  } catch (e) {
    log('取封面失败：' + e.message, 'err');
    if (box) box.innerHTML = `<p class="tip">${escapeHtml(e.message)}</p>`;
  }
}

function validate(quiet) {
  const t = S.types[cur.type];
  for (const f of t.fields) {
    if (!f.required) continue;
    if (!shows(f)) continue;
    if (!String(cur.front[f.key] ?? '').trim()) { log(`「${f.label}」还没填`, 'err'); return false; }
  }
  if (t.bodyRequired && !cur.body.trim() && !quiet) { log(`「${t.bodyLabel}」还没写`, 'err'); return false; }
  // 照片的 alt 在 schema 里是必填。空着保存能写成文件，但下一次构建会挂在
  // Zod 校验上 —— 而拖完图不填 alt 恰恰是最自然的操作，等于给自己埋雷。
  if (t.photos && !quiet) {
    const missing = cur.photos.findIndex((p) => !String(p.alt ?? '').trim());
    if (missing >= 0) {
      log(`第 ${missing + 1} 张照片还没写 alt 描述（读屏软件要用，也是构建必填项）`, 'err');
      return false;
    }
  }
  return true;
}

function buildFront() {
  const t = S.types[cur.type];
  const front = {};
  for (const f of t.fields) {
    // transient 只影响表单长什么样，不是内容 —— 写进 md 就多了一处会不同步的状态
    if (f.transient) continue;
    if (!shows(f)) continue;
    let v = cur.front[f.key];
    if (v === '' || v == null) continue;
    if (f.type === 'datetime') {
      // datetime-local 给的是无时区本地时间，补上本机偏移再写进去
      const d = new Date(v);
      const off = -d.getTimezoneOffset();
      const p = (n) => String(Math.floor(Math.abs(n))).padStart(2, '0');
      v = `${v}:00${off >= 0 ? '+' : '-'}${p(off / 60)}:${p(off % 60)}`;
    }
    if (f.type === 'rating') v = Number(v);
    front[f.key] = v;
  }
  if (cur.cover) front.cover = cur.cover;
  if (S.types[cur.type].photos) front.photos = cur.photos;
  front.draft = cur.front.draft === true || String(cur.front.draft) === 'true';
  return front;
}

async function save({ silent } = {}) {
  if (!silent && !validate()) return;
  const front = buildFront();
  const hasNote = S.types[cur.type].fields.some((f) => f.key === 'noteMode');
  const wantEssay = hasNote && cur.front.noteMode === 'essay';
  const hadEssay = hasNote && !!front.essay;
  // 切回短评：解除关联，但**不碰那个文件** —— 里面是写过的字，静默删掉太危险
  if (hasNote && !wantEssay) delete front.essay;
  // 长文模式下 essay 字段是隐藏的，buildFront 会跳过它。
  // 不在这儿补回去的话，服务端拿不到旧 id，每保存一次就派生出一篇新的长文。
  if (wantEssay && cur.front.essay) front.essay = cur.front.essay;

  const r = await api('/api/save', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      type: cur.type, id: cur.id, front, bodyText: cur.body,
      note: wantEssay ? { title: cur.front.noteTitle, body: cur.front.noteBody } : null,
    }),
  });
  cur.id = r.id;
  // 记住派生出的长文 id，再保存一次就落回同一篇，不会越存越多
  if (r.noteId) cur.front.essay = r.noteId;
  if (!silent) {
    log('已写入 ' + r.file, 'ok');
    if (r.noteId) log('长文一并写好了：src/content/essays/' + r.noteId + '.md', 'ok');
    else if (hadEssay && !wantEssay) log('已取消关联。那篇长文还在，要删去「长文」列表里删。');
  }
  await refresh();
  return r;
}

// 删除走两步：先问服务端这一条会连带删掉哪几个文件，把真实清单摆进确认框，
// 确认了再发第二次真删。「确定要删除吗？」这种确认框等于没有 ——
// 得让人看见具体是哪几个文件，以及删了还找不找得回来。
async function remove() {
  if (!cur.id) return;
  const payload = { type: cur.type, id: cur.id };
  const opts = (extra) => ({
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ ...payload, ...extra }),
  });
  const plan = await api('/api/delete', opts({ dryRun: true }));
  const lines = plan.files.map((f) => '  · ' + f).join('\n');
  const fate = plan.committed
    ? '这一条提交过，删错了还能用 git 找回来。'
    : '⚠ 这一条还没提交过 —— 删了 git 也救不回来。';
  if (!confirm(`要删掉这 ${plan.files.length} 个文件：\n\n${lines}\n\n${fate}`)) return;

  const r = await api('/api/delete', opts({}));
  r.removed.forEach((f) => log('已删除 ' + f, 'ok'));
  newEntry();
  await refresh();
}

async function refresh() {
  S = await api('/api/state');
  renderTypes(); renderList();
  const g = S.git;
  // 两个数字含义不同：提交上的是「几个文件改了」，发布上的是「几个提交没推」。
  // 数字长得一样，靠 title 讲清楚，免得看串。
  $('#btn-push').textContent = g.ahead > 0 ? `发布上线（${g.ahead}）` : '发布上线';
  $('#btn-push').title = g.ahead > 0 ? `${g.ahead} 个提交还没推送到线上` : '没有待推送的提交';
  $('#btn-commit').textContent = g.files.length ? `提交（${g.files.length}）` : '提交';
  $('#btn-commit').title = g.files.length ? `${g.files.length} 个文件有改动` : '工作区干净';
}

$('#btn-save').onclick = () => save().catch((e) => log(e.message, 'err'));
$('#btn-check').onclick = async () => {
  try {
    log('跑 astro check…');
    const r = await api('/api/check', { method: 'POST' });
    log(r.ok ? '校验通过' : '校验没过：\n' + r.out, r.ok ? 'ok' : 'err');
  } catch (e) { log(e.message, 'err'); }
};
$('#btn-commit').onclick = async () => {
  const msg = prompt('提交信息', `content: 更新${S.types[cur.type].label}`);
  if (!msg) return;
  try { await api('/api/commit', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ message: msg }) });
    log('已提交', 'ok'); await refresh();
  } catch (e) { log(e.message, 'err'); }
};
$('#btn-push').onclick = async () => {
  if (!confirm('推送到 main 会触发 Actions 自动部署，内容会真的上线。确定吗？')) return;
  try {
    // 先跑一遍类型/schema 校验再推。推上去才发现构建挂了，站点就停在旧版本，
    // 而你以为已经发出去了。宁可在这里多等十几秒。
    log('推送前先跑一遍校验…');
    const c = await api('/api/check', { method: 'POST' });
    if (!c.ok) { log('校验没过，已中止推送：\n' + c.out, 'err'); return; }
    const r = await api('/api/push', { method: 'POST' });
    log('已推送\n' + r.out, 'ok');
    await refresh();
  } catch (e) { log(e.message, 'err'); }
};

refresh().then(() => { newEntry(); log('就绪'); }).catch((e) => log(e.message, 'err'));
</script>
</body>
</html>
