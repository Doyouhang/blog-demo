name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 交易日北京时间 15:47（UTC 07:47）收盘后重建，刷新大盘复盘与股票行情
  schedule:
    - cron: '47 7 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /blog-demo/   # 项目页：/仓库名/ ；用户页(用户名.github.io)改为 /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      # 纯函数测试：YAML 序列化、slug 派生、EXIF 时区、路径校验。
      # 不需要浏览器，跑得快，放在最前面挡住低级错误。
      - name: Unit tests
        run: npm run test:unit
      # 这两步抓不到数据也不会失败，脚本会退回上一份（页面上会提示）
      - name: Fetch market pulse
        run: npm run fetch:market
      - name: Fetch stock quotes
        run: npm run fetch:stocks
      - run: npm run build
      # 冒烟跑构建产物。浏览器用 runner 自带的 Chrome，不额外下载。
      - name: Browser smoke tests
        run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
