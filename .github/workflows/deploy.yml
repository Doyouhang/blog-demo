name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 交易日北京时间 15:47（UTC 07:47）收盘后重建，刷新大盘复盘与股票行情
  schedule:
    - cron: '47 7 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: /blog-demo/   # 项目页：/仓库名/ ；用户页(用户名.github.io)改为 /
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run check
      # 纯函数测试：YAML 序列化、slug 派生、EXIF 时区、路径校验。
      # 不需要浏览器，跑得快，放在最前面挡住低级错误。
      - name: Unit tests
        run: npm run test:unit
      # 这两步抓不到数据也不会失败，脚本会退回上一份（页面上会提示）
      - name: Fetch market pulse
        run: npm run fetch:market
      - name: Fetch stock quotes
        run: npm run fetch:stocks
      - run: npm run build
      # 冒烟跑构建产物。浏览器用 runner 自带的 Chrome，不额外下载。
      - name: Browser smoke tests
        run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # 视觉快照：CI 渲染环境与本地字体/抗锯齿不同，不做像素比对，
      # 只截图上传 artifact 供人工对比；本地回归用 npm run test:visual。
      #
      # continue-on-error：这一步只是取证，不判定站点对错 —— 对错由上面的
      # 冒烟测试把关。让一个截图步骤拦住部署，等于用工具链的毛病扣住能用的站。
      # 失败仍然会在 Actions 里显示成橙色、日志照样留着，不会被吞掉。
      - name: Visual snapshots
        run: npm run test:visual -- --capture-only
        continue-on-error: true
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: tests/visual/actual
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
